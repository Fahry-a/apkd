[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "apkd"
version = "0.1.0"
description = "Provider-agnostic Android APK downloader"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32,<3",
  "beautifulsoup4>=4.12,<5",
]

[project.scripts]
apkd = "apkd.cli:main"

[tool.setuptools.packages.find]
include = ["apkd*"]
