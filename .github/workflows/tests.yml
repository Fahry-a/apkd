name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  live-providers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        provider: [uptodown, apkcombo, aptoide]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Live provider test
        env:
          # Pinning these to known-good versions avoids turning a moving
          # provider catalog into a false failure. Leave blank to test latest.
          APKD_UPTODOWN_PACKAGE: com.google.android.apps.photos
          APKD_APKCOMBO_PACKAGE: com.google.android.apps.photos
          APKD_APTOIDE_PACKAGE: com.google.android.apps.photos
        run: |
          python -m unittest tests.test_live_providers.LiveProviderTests.test_each_provider_resolves_and_downloads -v
